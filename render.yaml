services:
  - type: web
    name: viet-fuel-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: viet_fuel
      - key: UPSTREAM_BASE_URL
        value: https://vietfuel-api.tranqui.workers.dev
      - key: SYNC_SECRET
        sync: false
      - key: FIREBASE_ENABLED
        value: "false"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON_BASE64
        sync: false
